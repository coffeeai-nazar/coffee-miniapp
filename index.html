<style>
/* значення за замовчуванням = тема Espresso Noir; справжні приходять з сайту адміна (appearance) і ставляться скриптом нижче */
:root{--bg:#15100D;--card:#211913;--line:#372D26;--tab:#1B1410;--text:#F3E9DC;--mute:#9F9289;--soft:#CBC0B5;--acc:#E3A857;--acc2:#E8B87A;--on:#1B120B;--pic:#4A3524;--hero:#523B27;--bg0:#15100D00;--ok:#6FCF7F;--warn:#E7A44B;--bad:#E8967F;--danger:#C9483F;--okbg:#2A3A2A;--hf:'Unbounded';--r:16px;--r-sm:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Onest',sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
.scroll>*{flex:none}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 160px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--hf),sans-serif;font-weight:700;font-size:19px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px}
.cap{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pill{flex:none;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:600;font-size:13px}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.row{display:flex;gap:8px;overflow-x:auto}
.btn{min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-radius:var(--r);background:var(--acc);color:var(--on);font-weight:700;font-size:15px;border:0;width:100%}
.btn.center{justify-content:center}
.btn.ghost{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.sq{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:20px}
.sq.acc{background:var(--acc);border:0;color:var(--on);font-weight:700;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pic{height:104px;background:var(--pic);display:flex;align-items:center;justify-content:center;font-family:var(--hf),sans-serif;font-size:34px;color:var(--acc);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic svg{width:100%;height:100%;display:block}
input[type=text],input[type=tel]{width:100%;min-height:48px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);outline:0;color:var(--text);font-family:inherit;font-size:14px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:72px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--tab);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;color:var(--mute);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs button.on{color:var(--acc2)}
.dock{position:absolute;left:0;right:0;bottom:72px;padding:12px 16px;background:linear-gradient(to top,var(--bg) 70%,var(--bg0))}
.dock.low{bottom:0;padding-bottom:20px}
.sum div{display:flex;justify-content:space-between;color:var(--soft);padding:3px 0}
.sum .t{color:var(--text);font-weight:700;font-size:16px;font-family:var(--hf),sans-serif;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.sw{width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:.15s}
.sw.on{background:var(--acc)}.sw.on i{left:24px;background:var(--on)}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}.bar b{display:block;height:100%;background:var(--acc)}
.hide{display:none!important}
.toast{position:absolute;left:16px;right:16px;top:14px;padding:12px 14px;border-radius:var(--r-sm);background:var(--acc);color:var(--on);font-weight:700;z-index:9;display:none}
.lvl{display:flex;align-items:center;gap:12px;padding:12px 14px}
.lvl.me{border-color:var(--acc)}
.slot[disabled]{color:var(--mute);text-decoration:line-through;background:var(--tab)}

<script>
/* ===== ВИГЛЯД (appearance з сайту адміна) =====
   кольори, шрифт заголовків і цін, заокруглення, вигляд меню. Останній вигляд зберігається в localStorage і ставиться
   одразу при відкритті (без блимання), потім оновлюється з bootstrap. Некоректне чи відсутнє поле → Espresso Noir. */
const AP_DEFAULT={preset:"A",bg:"#15100D",card:"#211913",tx:"#F3E9DC",ac:"#E3A857",font:"Unbounded",radius:16,view:"tiles"};
const AP_FONTS={"Unbounded":"Unbounded:wght@500;700","Onest":"Onest:wght@400;500;600;700","Space Grotesk":"Space+Grotesk:wght@500;700","Playfair Display":"Playfair+Display:wght@600;700"};
function apNorm(a){
  a=a&&typeof a==="object"&&!Array.isArray(a)?a:{}; const H=/^#[0-9A-Fa-f]{6}$/, d=AP_DEFAULT;
  return {preset:["A","B","C","R","custom"].includes(a.preset)?a.preset:d.preset, bg:H.test(a.bg)?a.bg:d.bg, card:H.test(a.card)?a.card:d.card, tx:H.test(a.tx)?a.tx:d.tx, ac:H.test(a.ac)?a.ac:d.ac,
    font:Object.prototype.hasOwnProperty.call(AP_FONTS,a.font)?a.font:d.font, radius:Number.isInteger(a.radius)&&a.radius>=4&&a.radius<=28?a.radius:d.radius, view:a.view==="list"||a.view==="tiles"?a.view:d.view};
}
const apRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const apHex=c=>"#"+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("").toUpperCase();
// те саме, що CSS color-mix(in srgb, a p%, b): рахуємо в JS, бо старі Android WebView у Telegram не знають color-mix
const apMix=(a,b,p)=>{const x=apRgb(a),y=apRgb(b);return apHex(x.map((v,i)=>v*p/100+y[i]*(1-p/100)));};
const apLum=h=>{const c=apRgb(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];};
function applyAppearance(a,save){
  const A=apNorm(a), st=document.documentElement.style, set=(k,v)=>st.setProperty("--"+k,v);
  set("bg",A.bg); set("card",A.card); set("text",A.tx); set("acc",A.ac);
  set("mute",apMix(A.tx,A.bg,58));      // приглушений текст
  set("soft",apMix(A.tx,A.bg,80));      // другорядний текст
  set("line",apMix(A.tx,A.bg,14));      // лінії та рамки
  set("pic",apMix(A.ac,A.card,22));     // фон іконок і фото-заглушок
  set("hero",apMix(A.ac,A.card,26));    // градієнт головних карток
  set("tab",apMix(A.card,A.bg,55));     // нижня панель вкладок
  set("acc2",apMix(A.ac,A.tx,80));      // активна вкладка, підсвічений текст
  set("on",apLum(A.ac)>0.45?"#1B120B":"#FFFFFF"); // текст на кнопках акценту
  const light=apLum(A.bg)>0.45;
  set("ok",light?"#2E7D3A":"#6FCF7F"); set("warn",light?"#A85F00":"#E7A44B"); set("bad",light?"#B3261E":"#E8967F"); set("danger","#C9483F");
  set("okbg",apMix(light?"#2E7D3A":"#6FCF7F",A.card,14));
  set("bg0",A.bg+"00");
  set("hf","'"+A.font+"'"); set("r",A.radius+"px"); set("r-sm",Math.max(2,A.radius-4)+"px");
  st.colorScheme=apLum(A.bg)>0.45?"light":"dark";
  document.body&&(document.body.style.background=A.bg);
  if(A.font!=="Unbounded"&&A.font!=="Onest"&&!document.getElementById("apFont-"+A.font.replace(/\s/g,""))){
    const l=document.createElement("link"); l.rel="stylesheet"; l.id="apFont-"+A.font.replace(/\s/g,"");
    l.href="https://fonts.googleapis.com/css2?family="+AP_FONTS[A.font]+"&display=swap"; document.head.appendChild(l);
  }
  try{ const w=window.Telegram&&window.Telegram.WebApp; if(w){ if(w.setHeaderColor) w.setHeaderColor(A.bg); if(w.setBackgroundColor) w.setBackgroundColor(A.bg); if(w.setBottomBarColor) w.setBottomBarColor(A.bg); } }catch(e){}
  if(save){ try{ localStorage.setItem("ca_appearance",JSON.stringify(A)); }catch(e){} }
  window.AP=A; return A;
}
(function(){ let c=null; try{ c=JSON.parse(localStorage.getItem("ca_appearance")||"null"); }catch(e){} applyAppearance(c,false); })();
</script>

/* ===== Власні ілюстрації страв (єдиний стиль; справжнє фото m.img їх замінює) ===== */

async function api(path,body){
  if(!CONFIG.API_URL) return null;           // демо
  const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),25000); let r;
  try{
    r=await fetch(CONFIG.API_URL+"/"+path,{method:"POST",headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"1"},signal:ac.signal,
      body:JSON.stringify({initData:tg?tg.initData:"",...body})});
  }catch(e){ clearTimeout(to); throw new Error(e&&e.name==="AbortError"?"Довго немає відповіді від закладу. Спробуйте ще раз.":"Немає зв'язку із закладом. Перевірте інтернет."); }
  clearTimeout(to);
  let j=null; try{j=await r.json();}catch(e){}
  if(!r.ok){const er=new Error((j&&j.error)||("api "+r.status)); er.status=r.status; throw er;}
  return j;
}

function giftCalc(g,L){
  const free=(g&&g.free)||[], maxV=+(g&&g.maxValue)||0; const units=[];
  L.forEach(l=>{for(let k=0;k<l.q;k++) units.push({name:l.m.name,cat:l.m.cat,price:l.price});});
  const total=units.reduce((a,u)=>a+u.price,0);
  if(!free.length) return {amount:Math.min(maxV,total),matched:[],missing:[],units:[]};
  const chosen=[],matched=[],missing=[];
  free.forEach(c=>{const list=units.filter(u=>String(u.cat).toLowerCase()===String(c).toLowerCase()); if(!list.length){missing.push(c);return;} matched.push(c); chosen.push(list.reduce((a,b)=>b.price>a.price?b:a));});
  return {amount:Math.min(maxV,chosen.reduce((a,u)=>a+u.price,0)),matched,missing,units:chosen};
}

  return {sum,gift:g,giftAmt:gc.amount,giftUnits:gc.units,pay:Math.max(0,sum-gc.amount),count:L.reduce((a,l)=>a+l.q,0)};
}

// info.week — 7 днів Пн..Нд з аркуша «Інфо» (той самий «Графік», за яким бот приймає замовлення)
function hoursFor(d){
  const info=(S.data&&S.data.info)||{}; let a="", b="";
  if(Array.isArray(info.week)&&info.week.length===7){ const x=info.week[(d.getDay()+6)%7]; if(!x) return null; if(x.closed) return "closed"; a=x.from; b=x.to; }
  else { const hrs=info.hours||[], dow=d.getDay(); const row=(dow===0||dow===6)?(hrs[1]||hrs[0]):hrs[0]; if(!row) return null; if(/вихідн|зачин/i.test(String(row[0])+" "+String(row[1]))) return "closed"; const mm=String(row[1]).match(/(\d{1,2}:\d{2})\D+(\d{1,2}:\d{2})/); if(!mm) return null; a=mm[1]; b=mm[2]; }
  const m=(a+"-"+b).match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/); if(!m) return null;
  let o=+m[1]*60+ +m[2], c=+m[3]*60+ +m[4]; if(c<=o) c+=1440; return [o,c,m[1].padStart(2,"0")+":"+m[2],m[3].padStart(2,"0")+":"+m[4]];
}

function shopStateByHours(){
  const now=new Date(), h=hoursFor(now); if(!h) return {open:true,known:false};
  const t=now.getHours()*60+now.getMinutes();
  if(h!=="closed"){
    if(t>=h[0]&&t<h[1]) return {open:true,known:true,close:h[3]};
    if(t<h[0]) return {open:false,known:true,text:"Зараз зачинено. Відкриємось сьогодні о "+h[2]};
  }
  const DW=["у неділю","у понеділок","у вівторок","у середу","у четвер","у п’ятницю","у суботу"];
  for(let k=1;k<=7;k++){ const dd=new Date(now.getTime()+k*864e5), h2=hoursFor(dd); if(h2&&h2!=="closed") return {open:false,known:true,text:"Зараз зачинено. Відкриємось "+(k===1?"завтра":DW[dd.getDay()])+" о "+h2[2]}; }
  return {open:false,known:true,text:h==="closed"?"Сьогодні вихідний":"Зараз зачинено"};
}
function pickupOptions(){
  const now=new Date(), h=hoursFor(now);
  const closeMin=(h&&h!=="closed")?h[1]:21*60;
  let t=now.getHours()*60+now.getMinutes()+15; t=Math.ceil(t/30)*30; const out=["Якнайшвидше"];
  while(out.length<5&&t<=closeMin-10){out.push(String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")); t+=30;}
  return out;
}

async function pollOrder(){
  if(S.screen!=="track"||!S.last){stopPoll();return;}
  try{
    let m=null;
    if(S.data===DEMO){ S.tick=(S.tick||0)+1; const stt=S.tick>=3?"ready":(S.tick>=1?"accepted":"new"); m={state:stt}; }
    else { const r=await api("orders",{}); if(r&&Array.isArray(r.orders)){S.orders=r.orders; m=r.orders.find(o=>o.number===S.last.number); } }
    if(m&&m.state&&m.state!==S.last.state){ S.last={...S.last,...m}; if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred("success");}catch(e){}} renderTrack(); }
  }catch(e){}
  if(S.last&&(S.last.state==="ready"||S.last.state==="cancelled")) stopPoll();
}

// налаштування (зони, час, дні, максимум гостей, дитячі стільці, нагадування) і зайнятість приходять у bootstrap → booking;
// якщо сервер ще старий або це демо — запасний варіант зі старих полів
function bkCfg(){
  const b=S.data&&S.data.booking;
  if(b&&Array.isArray(b.zones)&&b.zones.length&&Array.isArray(b.days)&&b.days.length) return b;
  if(!S.bkFallback){
    const d0=new Date(), WD=["Нд","Пн","Вт","Ср","Чт","Пт","Сб"], pad=n=>String(n).padStart(2,"0");
    const days=[0,1,2,3,4,5,6].map(i=>{const d=new Date(d0.getTime()+i*864e5);return {day:i,date:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),wd:WD[d.getDay()],dom:d.getDate()};});
    S.bkFallback={zones:[{name:"Зала",seats:0}],times:(S.data&&S.data.slots)||["10:00","12:00","14:00","16:00","18:00","19:00","20:00"],daysAhead:7,maxGuests:8,kidsChairs:false,reminders:true,remindMin:120,days,busy:{},phone:"",name:""};
  }
  return S.bkFallback;
}
function bkState(){
  if(!S.bk){
    const c=bkCfg(), u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    S.bk={step:1,zone:c.zones.length===1?c.zones[0].name:"",day:0,time:"",guests:Math.min(2,c.maxGuests),kids:0,name:c.name||(u?[u.first_name,u.last_name].filter(Boolean).join(" "):""),phone:c.phone||"",note:"",done:null,sending:false};
  }
  return S.bk;
}
const bkBusy=(c,date,zone)=>((c.busy||{})[date]||{})[zone]||[];
const bkGuests=n=>{const a=n%10,b=n%100;return n+" "+(a===1&&b!==11?"гість":a>=2&&a<=4&&(b<12||b>14)?"гості":"гостей");};
function bkWhen(c,b){const d=c.days[b.day];if(!d)return b.time;const t=new Date(d.date+"T12:00:00").toLocaleDateString("uk-UA",{weekday:"long",day:"numeric",month:"long"});return (d.day===0?"Сьогодні, ":d.day===1?"Завтра, ":"")+t+", "+b.time;}
function bkRemind(c){
  if(!c.reminders) return "";
  const m=+c.remindMin||120, h=m/60;
  const t=m<60?m+" хвилин":m%60===0?(h===1?"годину":h+" "+(h<5?"години":"годин")):String(h).replace(".",",")+" години";
  return "За "+t+" до візиту ми нагадаємо.";
}
function bkValid(st,c){
  const b=bkState(), d=c.days[b.day];
  if(st===1) return !!(b.zone&&b.time&&d&&!bkBusy(c,d.date,b.zone).includes(b.time));
  if(st===2) return b.guests>=1&&b.guests<=c.maxGuests&&b.kids>=0&&b.kids<=b.guests;
  if(st===3) return !!b.name.trim()&&b.phone.replace(/\D/g,"").length>=10;
  return true;
}
// уточнює зайнятість обраного дня й зони на сервері (ті самі правила, що й при бронюванні)
async function loadSlots(dayArg,zoneArg){
  const c=bkCfg(), b=bkState();
  const day=Number.isInteger(dayArg)?dayArg:b.day, zone=zoneArg||b.zone, d=c.days.find(x=>x.day===day);
  if(d&&zone&&CONFIG.API_URL){
    try{ const r=await api("slots",{day,zone});
      if(r&&Array.isArray(r.slots)){ c.busy=c.busy||{}; c.busy[d.date]=c.busy[d.date]||{}; c.busy[d.date][zone]=c.times.filter(t=>!r.slots.includes(t)||(r.busy||[]).includes(t)); } }catch(e){}
  }
  const cur=c.days[b.day];
  if(b.time&&cur&&bkBusy(c,cur.date,b.zone).includes(b.time)) b.time="";
  if(b.time&&d&&bkBusy(c,d.date,b.zone).includes(b.time)) b.time="";
  renderBook();
}

function bkDock(){

async function bkAction(a){
  const c=bkCfg(), b=bkState();
  if(a==="g-"){ b.guests=Math.max(1,b.guests-1); b.kids=Math.min(b.kids,b.guests); }
  else if(a==="g+") b.guests=Math.min(c.maxGuests,b.guests+1);
  else if(a==="k-") b.kids=Math.max(0,b.kids-1);
  else if(a==="k+") b.kids=Math.min(b.guests,b.kids+1);
  else if(a==="next"){ if(!bkValid(b.step,c)) return; b.step=Math.min(4,b.step+1); }
  else if(a==="back") b.step=Math.max(1,b.step-1);
  else if(a==="again"){ S.bk=null; bkState(); loadSlots(); return; }
  else if(a==="send"){
    if(b.sending) return; b.sending=true; bkDock();
    try{
      const r=await api("booking",{zone:b.zone,day:b.day,time:b.time,guests:b.guests,kids:c.kidsChairs?b.kids:0,name:b.name.trim(),phone:b.phone.trim(),note:b.note.trim()});
      const no=r&&r.booking&&r.booking.number;
      b.done=(no?"№"+no+" · ":"")+bkWhen(c,b)+" · "+b.zone+" · "+bkGuests(b.guests);
      // щойно створена бронь одразу з'являється в «Моїх бронях»
      bkMineList();
      if(no&&!(S.bkMine||[]).some(x=>String(x.booking_no)===String(no))){ const d=c.days[b.day]; S.bkMine.push({id:+no||no,booking_no:String(no),date:d?d.date:"",day:b.day,time:b.time,zone:b.zone,guests:b.guests,kids:c.kidsChairs?b.kids:0,status:"new",at:(r.booking&&r.booking.at)||""}); }
      S.bkNotice="";
      c.phone=b.phone.trim(); c.name=b.name.trim();
      if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred("success");}catch(e){}}
    }catch(e){
      toast(e.message&&/[А-Яа-яІіЇїЄєҐґ]/.test(e.message)?e.message:"Не вдалося забронювати. Спробуйте ще раз.",7000);
      if(e.status===409) loadSlots();
    }
    b.sending=false;
  }
  renderBook();
  if(a==="next"||a==="back"){ const sc=document.querySelector("#s-book .scroll"); if(sc) sc.scrollTop=0; }
}

function lyCode(){
  const c=LY().code;
  lySheet(`<h2 style="margin:0 0 6px">Ваш код</h2><div style="color:var(--soft)">${c?"Покажіть баристі на касі":"Код з'явиться після першого замовлення"}</div>${c?`<div style="font-family:var(--hf),sans-serif;font-weight:700;font-size:40px;letter-spacing:.14em;color:var(--acc);margin:18px 0 6px">${esc(c)}</div>`:""}<button class="btn center ghost" data-ly="close" style="margin-top:14px">Закрити</button>`,"Ваш код");
}
function lyExchange(i){
  const ly=LY(), r=ly.rules.rewards.find(x=>x.i===i); if(!r) return;
  S.lyX=i;
  lySheet(`<div style="font-size:40px">${esc(r.emoji)}</div><h2 style="margin:6px 0">${esc(r.name)}</h2><div style="color:var(--soft)">Списати <b style="color:var(--acc)">${r.cost} ${ptsW(r.cost)}</b>? Подарунок з’явиться в «Моїх подарунках» на ${daysW(ly.rules.rewardValidDays)}.</div><div id="lyErr" style="color:var(--bad);margin-top:10px"></div>`+lyBtns("Скасувати","Обміняти","x-yes"),"Обміняти бали");
}
async function lyExchangeDo(){
  if(S.lyBusy) return; S.lyBusy=true; const b=document.querySelector('#lySheet [data-ly="x-yes"]'); if(b){b.disabled=true;b.textContent="Обмінюємо…";}
  try{
    if(!CONFIG.API_URL){ const r=LY().rules.rewards.find(x=>x.i===S.lyX); S.data.loyalty.points-=r.cost; S.data.loyalty.gifts.push({id:Date.now(),emoji:r.emoji,name:r.name,until:new Date(Date.now()+LY().rules.rewardValidDays*864e5).toISOString(),free:r.free,maxValue:r.maxValue}); S.data.loyalty.history.unshift({text:"Обмін: "+r.emoji+" "+r.name,points:-r.cost}); lySheetClose(); toast("Готово! «"+r.name+"» у ваших подарунках."); renderAll(); return; }
    const r=await api("reward-exchange",{rewardIndex:S.lyX});
    if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred("success");}catch(e){}}
    lySheetClose(); toast((r&&r.text)||"Готово! Подарунок у «Моїх подарунках».",5000); await refreshBoot();
  }catch(e){ const x=$("#lyErr"); if(x) x.textContent=e.message||"Не вдалося обміняти бали."; if(b){b.disabled=false;b.textContent="Обміняти";} }
  finally{ S.lyBusy=false; }
}
// вибір подарунка в кошику; якщо в кошику є не всі категорії подарунка — спершу попередження
function lyGiftPick(){
  const g=LY().gifts; if(!g.length) return;
  if(g.length===1) return lyGiftTry(g[0].id);
  lySheet(`<h2 style="margin:0 0 12px">Застосувати подарунок</h2><div style="display:flex;flex-direction:column;gap:8px;text-align:left">${g.map(x=>`<button class="card" data-ly="gift:${x.id}" style="display:flex;gap:12px;align-items:center;padding:12px;color:var(--text);font:inherit;text-align:left;width:100%"><span style="font-size:24px">${esc(x.emoji||"🎁")}</span><span style="flex:1"><b>${esc(x.name)}</b><span style="display:block;color:var(--mute);font-size:12px">Діє до ${dShort(x.until)}</span></span></button>`).join("")}</div><button class="btn center ghost" data-ly="close" style="margin-top:14px">Скасувати</button>`,"Застосувати подарунок");
}
function lyGiftTry(id){
  const g=LY().gifts.find(x=>String(x.id)===String(id)); if(!g) return;
  const c=giftCalc(g,lines());
  if(!(c.amount>0)){ lySheetClose(true); toast("Подарунок «"+g.name+"» діє на: "+(g.free||[]).join(", ")+". Додайте таку позицію в кошик.",6000); return; }
  if(c.missing.length){
    S.lyGift=g.id;
    lySheet(`<div style="font-size:36px">${esc(g.emoji||"🎁")}</div><h2 style="margin:6px 0">${esc(g.name)}</h2><div style="color:var(--soft)">У кошику немає позиції з категорії ${esc(c.missing.join(", "))}: подарунок діятиме лише на ${esc(c.matched.join(", "))}. Застосувати?</div>`+lyBtns("Скасувати","Застосувати","gift-yes"),"Застосувати подарунок");
    return;
  }
  lySheetClose(); S.gift=g.id; renderCart();
}
async function lyBirthday(){
  const v=($("#bdIn")||{}).value||""; S.bdIn=v;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ toast("Оберіть дату народження"); return; }
  if(S.bdBusy) return; S.bdBusy=true; renderBonus();
  try{
    if(!CONFIG.API_URL){ S.data.loyalty.birthday=v.slice(8,10)+"."+v.slice(5,7); }
    else { const r=await api("birthday-set",{date:v}); S.data.loyalty.birthday=r.birthday; }
    toast("Дату збережено. Подарунок прийде до свята 🎉",5000);
  }catch(e){ toast(e.message||"Не вдалося зберегти дату.",6000); if(e.status===409) refreshBoot(); }
  finally{ S.bdBusy=false; renderBonus(); }
}
// свіжі дані після обміну / помилки подарунка
async function refreshBoot(){
  try{ const d=await api("bootstrap",{}); if(d){ S.data=d; try{ localStorage.setItem("ca_boot",JSON.stringify(d)); }catch(e){} renderAll(); } }catch(e){}
}
function renderInfo(){
  // усе з аркуша «Інфо» (адмінка → settings.save); кнопки показуються лише для заповнених полів
  const i=S.data.info||{}; const v=k=>String(i[k]==null?"":i[k]).trim();
  const name=v("name")||CONFIG.SHOP_NAME, tagline=v("tagline"), desc=("description" in i)?v("description"):v("about");
  const hrsRows=(v("hours_weekdays")||v("hours_weekend"))?[["Будні (Пн–Пт)",v("hours_weekdays")||"—"],["Вихідні (Сб–Нд)",v("hours_weekend")||"—"]]:(i.hours||[]);
  const tel=v("phone").replace(/[^\d+]/g,"");
  const nick=x=>x.replace(/^@/,"");
  const ig=v("instagram")?(/^https?:\/\//i.test(v("instagram"))?v("instagram"):"https://instagram.com/"+encodeURIComponent(nick(v("instagram")))):"";
  const map=/^https:\/\//i.test(v("map_url"))?v("map_url"):"";
  const adm=/^@?[A-Za-z0-9_]{5,32}$/.test(v("admin_username"))?"https://t.me/"+nick(v("admin_username")):"";
  const ss=shopState();
  $("#infoBody").innerHTML=`<div class="card" style="padding:18px;background:linear-gradient(135deg,var(--hero),var(--card))"><div style="font-family:var(--hf),sans-serif;font-weight:700;font-size:22px">${esc(name)}</div>${tagline?`<div style="color:var(--acc2);margin-top:6px;font-weight:600">${esc(tagline)}</div>`:""}${desc?`<div style="color:var(--soft);margin-top:6px;white-space:pre-line">${esc(desc)}</div>`:""}</div>
  ${hrsRows.length?`<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:12px">${ss.known?`<b style="color:${ss.open?"var(--acc2)":"var(--bad)"}">${ss.open?"Відчинено до "+esc(ss.close):esc(ss.text)}</b>`:""}${hrsRows.map(h=>`<div style="display:flex;justify-content:space-between;gap:10px"><span style="color:var(--mute)">${esc(h[0])}</span><b style="text-align:right">${esc(h[1])}</b></div>`).join("")}</div>`:""}
  ${v("address")?`<div class="card" style="padding:14px"><div style="color:var(--mute);font-size:12px">Адреса</div><b>${esc(v("address"))}</b></div>`:""}
  ${tel.replace(/\D/g,"").length>=7?`<a class="btn center" href="tel:${esc(tel)}" style="text-decoration:none">Подзвонити · ${esc(v("phone"))}</a>`:""}
  ${ig?`<button class="btn center ghost" data-link="${esc(ig)}">Instagram</button>`:""}
  ${map?`<button class="btn center ghost" data-link="${esc(map)}">Показати на карті</button>`:""}
  <button class="btn center ghost" id="askAdmin">Написати адміністратору</button>`;
  $$("#infoBody [data-link]").forEach(b=>b.onclick=()=>{ const u=b.dataset.link; if(tg&&tg.openLink) tg.openLink(u); else window.open(u,"_blank","noopener"); });
  $("#askAdmin").onclick=()=>{
    if(adm){ if(tg&&tg.openTelegramLink) tg.openTelegramLink(adm); else window.open(adm,"_blank","noopener"); return; }
    if(tg&&tg.close){ toast("Напишіть боту в чаті"); setTimeout(()=>tg.close(),900);} else toast("Відкрийте міні-апп у Telegram");
  };
}

/* ===== ПОДІЇ ===== */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){go(g.dataset.go);return;}
  const t=e.target.closest("[data-tab]"); if(t){go(t.dataset.tab);return;}
  const c=e.target.closest("[data-cat]"); if(c){S.cat=c.dataset.cat;S.q="";$("#q").value="";renderMenu();return;}
  const a=e.target.closest("[data-add]"); if(a){add(a.dataset.add,1);return;}
  const p=e.target.closest("[data-prod]"); if(p){S.prod=p.dataset.prod;S.opt={size:0,milk:0,qty:1};go("prod");return;}
  const sz=e.target.closest("[data-size]"); if(sz){S.opt.size=+sz.dataset.size;renderProd();return;}
  const mk=e.target.closest("[data-milk]"); if(mk){S.opt.milk=+mk.dataset.milk;renderProd();return;}
  const inc=e.target.closest("[data-inc]"); if(inc){add(inc.dataset.inc,1);return;}
  const dec=e.target.closest("[data-dec]"); if(dec){add(dec.dataset.dec,-1);return;}
  const pk=e.target.closest("[data-pick]"); if(pk){S.pickup=pk.dataset.pick;renderCart();return;}
  const bxs=e.target.closest("[data-bxs]"); if(bxs&&!bxs.disabled){ if(bxs.dataset.bxs==="yes") bkCancel(); else if(!S.bkCancelling) bkSheetClose(); return; }
  const bx=e.target.closest("[data-bx]"); if(bx){bkSheet(bx.dataset.bx);return;}
  const bz=e.target.closest("[data-bz]"); if(bz){const b=bkState();b.zone=bz.dataset.bz;b.time="";S.bkNotice="";renderBook();loadSlots();return;}
  const bd=e.target.closest("[data-bd]"); if(bd){const b=bkState();b.day=+bd.dataset.bd;b.time="";S.bkNotice="";renderBook();loadSlots();return;}
  const bt=e.target.closest("[data-bt]"); if(bt&&!bt.disabled){bkState().time=bt.dataset.bt;S.bkNotice="";renderBook();return;}
  const bk=e.target.closest("[data-bk]"); if(bk&&!bk.disabled){ if(bk.dataset.bk==="next"||bk.dataset.bk==="again") S.bkNotice=""; bkAction(bk.dataset.bk);return;}
  const rp=e.target.closest("[data-repeat]"); if(rp){repeatOrder(+rp.dataset.repeat);return;}
  const ly=e.target.closest("[data-ly]"); if(ly&&!ly.disabled){ const a=ly.dataset.ly;
    if(a==="close"){ if(!S.lyBusy) lySheetClose(); return; }
    if(a==="code"){ lyCode(); return; }
    if(a.startsWith("x:")){ lyExchange(+a.slice(2)); return; }
    if(a==="x-yes"){ lyExchangeDo(); return; }
    if(a==="gift-open"){ lyGiftPick(); return; }
    if(a.startsWith("gift:")){ lyGiftTry(a.slice(5)); return; }
    if(a==="gift-yes"){ lySheetClose(); S.gift=S.lyGift; renderCart(); return; }
    if(a==="gift-off"){ S.gift=null; renderCart(); return; }
    if(a==="bd-save"){ lyBirthday(); return; }  }
});
$("#q").addEventListener("input",e=>{S.q=e.target.value;renderMenu();});
$("#cartBtn").onclick=()=>go("cart");
$("#activeOrder").onclick=()=>{const ao=activeOrder(); if(ao){S.last=ao; go("track");}};
$("#bonusChip").onclick=()=>go("bonus");
$("#orderBtn").onclick=placeOrder;
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="comment") S.comment=e.target.value;
  // крок 3 бронювання: зберігаємо введене без перемальовування (щоб не губився фокус) і оновлюємо «Далі»
  if(id==="bkName"||id==="bkPhone"||id==="bkNote"){ const b=bkState(); b[{bkName:"name",bkPhone:"phone",bkNote:"note"}[id]]=e.target.value; bkDock(); }
});
load();
</script>
